# Redraws the printed-contributions graphic from the real contribution
# calendar and refreshes the Open source list, once a day. It uses only this
# repo's own token: no secrets, nothing outside GitHub.
name: profile
on:
  schedule:
    - cron: "17 11 * * *"   # 06:17 in Ames (CDT)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Worldline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query{user(login:"jonboy648"){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}' > "$RUNNER_TEMP/calendar.json"
          python3 scripts/generate_worldline.py "$RUNNER_TEMP/calendar.json" assets

      - name: Open source list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "search/issues?q=is:pr+author:jonboy648+is:merged+is:public+-user:jonboy648+-user:VarietyVaultLLC&sort=updated&per_page=10" \
            | python3 scripts/open_source.py README.md

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet && { echo "No changes."; exit 0; }
          git commit -m "Refresh the profile"
          git push
